name: SwitchMirror
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  SwitchMirror:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.switchmirror
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Switch
        INFOPLIST_KEY_NSCameraUsageDescription: 캡처보드 영상을 화면에 표시합니다.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 캡처보드 소리를 스피커로 재생합니다.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
