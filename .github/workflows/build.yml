name: build
on: [push, workflow_dispatch]
permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - run: >
          xcodebuild -project SwitchMirror.xcodeproj -target SwitchMirror
          -configuration Release -sdk iphoneos SYMROOT=build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      # 서명 안 된 IPA — Sideloadly가 설치하면서 서명함
      - run: |
          mkdir Payload
          cp -R build/Release-iphoneos/SwitchMirror.app Payload/
          zip -qr SwitchMirror.ipa Payload
      # iPad Safari에서 바로 받기: releases/latest/download/SwitchMirror.ipa
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest SwitchMirror.ipa --title "SwitchMirror" --notes "${{ github.sha }}"
